<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kitten Skull</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3efe6;
      color: #111;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .coming-soon {
      width: min(90%, 700px);
      padding: 40px 20px;
    }

    .logo {
      display: block;
      width: min(100%, 520px);
      height: auto;
      margin: 0 auto 20px;
    }

    .message {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .subtext {
      margin-top: 12px;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <main class="coming-soon">

    <img
      class="logo"
      src="7529C08B-27C6-4D95-BE7E-7F4F017F684F.png"
      alt="Kitten Skull"
    >

    <p class="message">Coming Soon</p>

    <p class="subtext">
      Handmade gemstone jewelry for strange little souls.
    </p>

  </main>

</body>
</html>
